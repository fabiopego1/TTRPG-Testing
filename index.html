<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Runeterra Atlas — Demacia maps to scale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 2.5v11M2.5 8h11" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
    <symbol id="i-minus" viewBox="0 0 16 16"><path d="M2.5 8h11" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
    <symbol id="i-fit" viewBox="0 0 16 16"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
    <symbol id="i-token" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-marker" viewBox="0 0 16 16"><path d="M8 1.8L12.4 7 8 14.2 3.6 7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="miter"/><circle cx="8" cy="6.6" r="1.3" fill="currentColor"/></symbol>
    <symbol id="i-ruler" viewBox="0 0 16 16"><path d="M1.8 11.2L11.2 1.8l3 3-9.4 9.4z M5 8l1.6 1.6M7.4 5.6L9 7.2M9.8 3.2l1.2 1.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="miter"/></symbol>
    <symbol id="i-canon" viewBox="0 0 12 12"><path d="M6 .8L11.2 6 6 11.2.8 6z" fill="currentColor"/></symbol>
    <symbol id="i-invented" viewBox="0 0 12 12"><path d="M6 1.4L10.6 6 6 10.6 1.4 6z" fill="none" stroke="currentColor" stroke-width="1.2"/></symbol>
  </defs>
</svg>

<header class="mast">
  <a class="mark" href="./" aria-label="Runeterra Atlas">
    <svg viewBox="0 0 40 44" width="30" height="33" aria-hidden="true"><path d="M20 1.5L37.5 8v14c0 9.2-7.2 16.4-17.5 20.5C9.7 38.400 2.500 31.200 2.500 22V8z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M20 8v26M12 15l8 6 8-6M10.500 22l9.500 6 9.500-6" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
    <span class="wordmark"><b>Runeterra Atlas</b><i>Demacia</i></span>
  </a>
  <nav class="chapters" id="scaleTabs" aria-label="Map level">
    <button data-level="city" class="on" aria-pressed="true"><span class="num">I</span><span class="lbl">City</span><kbd>1</kbd></button>
    <button data-level="site" aria-pressed="false"><span class="num">II</span><span class="lbl">Below the city</span><kbd>2</kbd></button>
  </nav>
</header>

<div class="layout">
  <aside class="rail" id="controls">
    <section>
      <h3 class="sec">Map</h3>
      <label class="fld"><span class="sr">Map</span><select id="mapSel"></select></label>
      <button id="scaleBtn" class="btn quiet">Scale &amp; token guide</button>
    </section>
    <section>
      <h3 class="sec">Light &amp; overlay</h3>
      <label class="fld"><span>Lighting</span><select id="themeSel"><option value="day">Day</option><option value="night">Night — fire and moon</option></select></label>
      <div class="checks">
        <label><input type="checkbox" id="tLabels" checked><span>Labels</span></label>
        <label><input type="checkbox" id="tNumbers" checked><span>Numbers</span></label>
        <label><input type="checkbox" id="tDeco" checked><span>Frame &amp; scale bar</span></label>
      </div>
    </section>
    <section>
      <h3 class="sec">Tokens &amp; tools</h3>
      <label class="fld"><span>Type</span><select id="tokType"></select></label>
      <label class="fld"><span>Size</span><select id="tokSize"></select></label>
      <div class="tools">
        <button id="toolToken" class="btn tool"><svg><use href="#i-token"/></svg>Place tokens</button>
        <button id="toolPin" class="btn tool"><svg><use href="#i-marker"/></svg>Note markers</button>
        <button id="toolMeasure" class="btn tool"><svg><use href="#i-ruler"/></svg>Ruler</button>
      </div>
      <p class="hint" id="toolHint"></p>
    </section>
    <section>
      <h3 class="sec">Export</h3>
      <button id="exVtt" class="btn primary" title="Just the art: no labels, frame, markers or tokens">VTT-ready PNG</button>
      <div class="split"><button id="exPng" class="btn" title="Includes labels, numbers, tokens and the frame">PNG</button><button id="exSvg" class="btn" title="Vector, with labels and tokens">SVG</button></div>
      <label class="fld"><span>Resolution</span><select id="pxSel"></select></label>
      <p class="hint mono" id="exInfo"></p>
    </section>
    <section>
      <h3 class="sec">Campaign</h3>
      <div class="split"><button id="saveJson" class="btn">Save</button><button id="loadJson" class="btn">Load</button></div>
      <button id="resetAll" class="btn danger">Clear tokens &amp; notes</button>
      <input type="file" id="fileIn" accept="application/json" hidden>
    </section>
  </aside>

  <main class="stage" id="stage">
    <div class="bracket" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <svg id="map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Marcellus, Georgia, serif" role="img" aria-label="Interactive map"></svg>
    <div class="cartouche" id="crumb"></div>
    <div class="zoom">
      <button id="zIn" aria-label="Zoom in"><svg><use href="#i-plus"/></svg></button>
      <button id="zOut" aria-label="Zoom out"><svg><use href="#i-minus"/></svg></button>
      <button id="zReset" aria-label="Fit map"><svg><use href="#i-fit"/></svg></button>
    </div>
    <div class="toast" id="toast" role="status"></div>
  </main>

  <aside class="codex" id="panel" aria-live="polite"></aside>
</div>
<script src="js/core.js"></script>
<script src="js/lore.js"></script>
<script src="js/scene.js"></script>
<script src="js/maps/crownguard.js"></script>
<script src="js/maps/silvermere.js"></script>
<script src="js/app.js"></script>
</body>
</html>
